<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2.2 Die Celsiusskala · NT 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>/* Bewusst ein helles Klassenzimmer-Design (iPad), Farben wie die Canva-Folien */
:root{color-scheme:light;
  --bg:#F4EEE3;--card:#FFFDF8;--ink:#3B342C;--muted:#7a7066;--line:#E2D9C8;
  --sun:#E8A33A;--sun2:#D98A1F;--hot:#C9553A;--cold:#2F6FB0;--ok:#2E7D32;--okl:#E3F2E1;--bad:#C0392B;--badl:#FBE4E0;
  --sel:#FFE7B8;--sky-l:#E7F1FA;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:18px 0 8px;flex-wrap:wrap}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px;text-decoration:none}
a.pill:hover{opacity:.85}
h1{font-size:32px;line-height:1.15;margin:6px 0 4px;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 18px 16px;margin:16px 0;position:relative}
.card.s1{border-left:8px solid var(--sun)}.card.s2{border-left:8px solid var(--cold)}.card.s3{border-left:8px solid #8E44AD}
.card.done-ok{background:#F4FBF3}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:0 0 auto;background:var(--ink);color:#fff;border-radius:12px;min-width:36px;height:36px;display:grid;place-items:center;font-weight:800}
.q{font-weight:800;font-size:20px;flex:1;margin:4px 0 12px}
.stars{font-size:15px;white-space:nowrap;margin-top:8px}
.s1 .stars{color:var(--sun)}.s2 .stars{color:var(--cold)}.s3 .stars{color:#8E44AD}
.speak{flex:0 0 auto;border:0;background:var(--sky-l);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
.fig{max-width:340px;margin:0 auto 12px}
.fig svg,.opt svg{width:100%;height:auto;display:block;background:#fff;border-radius:12px;border:1.5px solid var(--line)}
.opts{display:grid;gap:10px}
.opts.img{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;min-height:56px;font-weight:700;display:flex;flex-direction:column;gap:8px;justify-content:center}
.opt.sel{border-color:var(--sun2);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--okl)}
.opt.bad{border-color:var(--bad);background:var(--badl)}
.tf{display:grid;gap:10px}
.tfrow{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.tfrow .t{flex:1;font-weight:700}
.tfrow button{border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;min-width:84px;cursor:pointer;font-weight:800}
.tfrow button.sel{border-color:var(--sun2);background:var(--sel)}
.tfrow.ok{border-color:var(--ok);background:var(--okl)}.tfrow.bad{border-color:var(--bad);background:var(--badl)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.match .col{display:grid;gap:10px;align-content:start}
.mitem{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 12px;min-height:58px;cursor:pointer;font-weight:700;text-align:left;position:relative}
.mitem.active{border-color:var(--sun2);box-shadow:0 0 0 4px var(--sel)}
.mitem .tag{position:absolute;top:-10px;right:-8px;background:var(--ink);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px}
.mitem.ok{border-color:var(--ok);background:var(--okl)}.mitem.bad{border-color:var(--bad);background:var(--badl)}
.cloze{font-size:20px;line-height:2.5;margin:0 0 12px}
.gap{display:inline-block;min-width:110px;border:0;border-bottom:3px solid var(--cold);background:var(--sky-l);border-radius:10px 10px 0 0;padding:0 10px;font-weight:800;cursor:pointer;line-height:1.7;text-align:center}
.gap.active{background:var(--sel);border-color:var(--sun2)}
.gap.ok{background:var(--okl);border-color:var(--ok)}.gap.bad{background:var(--badl);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#fffbef;border-radius:16px;border:2px dashed var(--sun)}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;min-height:46px}
.chip.used{opacity:.3}
.chip.active{border-color:var(--sun2);background:var(--sel)}
.olist{display:grid;gap:10px}
.ocard{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:700;text-align:left;width:100%}
.ocard .n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:3px dashed var(--muted);display:grid;place-items:center;font-weight:800}
.ocard.sel .n{border:0;background:var(--sun2);color:#fff}
.ocard.ok{border-color:var(--ok);background:var(--okl)}.ocard.bad{border-color:var(--bad);background:var(--badl)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:16px;background:#f3eee3;margin-bottom:12px}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.bucket{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;cursor:pointer;background:#fff}
.bucket h4{margin:0 0 8px;font-size:17px}
.bucket .chip{display:inline-block;margin:3px}
.bucket.hl{border-color:var(--sun2);background:#fffaf0}
.chip.ok{border-color:var(--ok);background:var(--okl)}.chip.bad{border-color:var(--bad);background:var(--badl)}
.thermos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.th svg{height:230px;width:auto}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer}
.stepper .v{min-width:72px;font-weight:800;font-size:20px}
.th.ok{border-color:var(--ok);background:var(--okl)}.th.bad{border-color:var(--bad);background:var(--badl)}
.setth{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.setth input[type=range]{width:260px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;cursor:pointer;background:var(--sun);color:#fff;min-height:48px}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.fb{font-weight:800;border-radius:12px;padding:10px 14px;margin-top:12px;display:none}
.fb.ok{display:block;background:var(--okl);color:var(--ok)}
.fb.bad{display:block;background:var(--badl);color:var(--bad)}
.fb.info{display:block;background:var(--sky-l);color:var(--cold)}
.tip{display:none;margin-top:10px;background:#fffbef;border:2px dashed var(--sun);border-radius:12px;padding:8px 12px}
.tip.show{display:block}
.film{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.film .play{flex:0 0 64px;height:64px;border-radius:18px;background:var(--hot);color:#fff;display:grid;place-items:center;font-size:28px}
.film b{display:block;font-size:19px}
.intro{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.intro input{font:inherit;padding:10px 14px;border-radius:12px;border:2px solid var(--line);min-width:220px}
.result{text-align:center}
.result .big{font-size:56px;line-height:1}
.result .score{font-size:30px;font-weight:800;margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:10px}
.tile{display:block;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:inherit;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile svg{width:100%;height:auto;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.tile .no{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px;margin-top:10px}
.tile h3{margin:6px 0 2px;font-size:21px}
.tile .prog{color:var(--muted);font-size:15px}
.tile.test{border-color:var(--sun)}
.sim canvas{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line);touch-action:none}
.simctl{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.simctl input{flex:1;min-width:200px;accent-color:var(--hot)}
.badge2{font-weight:800}
.foot{color:var(--muted);font-size:14px;margin-top:30px;text-align:center}
@media (max-width:560px){h1{font-size:26px}.match{grid-template-columns:1fr 1fr;gap:8px}.mitem{font-size:15px;padding:8px}.q{font-size:18px}}

/* ---- Freigabe / Sperre ---- */
.tile{position:relative}
.tile .thead{display:flex;align-items:center;gap:10px;margin-top:10px}
.tile .thead .no{margin:0;font-size:18px;padding:3px 14px;flex:0 0 auto}
.tile .thead h3{margin:0;font-size:21px;line-height:1.2}
.tile .lockbadge{position:absolute;top:22px;right:22px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px}
.tile .lockbadge:empty{display:none}
.tile.locked{cursor:not-allowed;background:#EEE8DD}
.tile.locked:hover{transform:none}
.tile.locked svg{filter:grayscale(1) opacity(.45)}
.tile.locked h3,.tile.locked .prog{opacity:.55}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
#freiinfo{font-weight:700;color:var(--hot);margin:0 0 6px}
#freiinfo:empty{display:none}
.tbtn{background:none;border:2px solid var(--line);border-radius:999px;padding:6px 16px;color:var(--muted);font-weight:700;cursor:pointer;margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(59,52,44,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:22px;max-width:620px;width:100%;padding:20px 20px 18px;position:relative;border:2px solid var(--line)}
.mbox h2{margin:0 0 10px;font-size:24px}
.x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:28px;cursor:pointer;color:var(--muted)}
.pinrow{display:flex;gap:10px;margin-top:8px}
.pinrow input{flex:1;font:inherit;font-size:24px;letter-spacing:6px;padding:8px 14px;border:2px solid var(--line);border-radius:14px;min-width:0}
.btn{font:inherit;font-weight:800;border:none;border-radius:14px;padding:10px 18px;background:var(--sun);color:#fff;cursor:pointer}
.btn.g{background:var(--ink)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.trow .no{color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.trow .tt{flex:1;font-weight:700}
.sw{position:absolute;opacity:0;width:1px;height:1px}
.swl{width:56px;height:32px;border-radius:999px;background:#CFC6B6;position:relative;transition:.15s;flex:0 0 auto}
.swl::after{content:"🔒";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;transition:.15s}
.sw:checked+.swl{background:var(--ok)}
.sw:checked+.swl::after{content:"✓";left:27px;color:var(--ok);font-weight:800}
.sw:focus-visible+.swl{outline:3px solid var(--sun)}
.tbar{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.share{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:14px;background:var(--sky-l);border-radius:16px;padding:14px}
.share .l{flex:1;min-width:220px}
.share input{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;margin:6px 0 8px}
#qr{background:#fff;padding:8px;border-radius:10px;min-height:40px;font-size:14px;color:var(--muted)}
#qr img,#qr canvas{display:block}
.lockpage{text-align:center;padding:40px 20px;margin-top:40px}
.lockpage h1{font-size:28px}

/* ---- Aufbau wie GPG 5 (Startseite + Reiter), Farben/Schrift NT ---- */
.wrap.wide{max-width:1040px}
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px 24px;margin:24px 0 22px}
.shead h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:900;line-height:1.08;margin:0;text-wrap:balance}
.shead .bar{width:70px;height:5px;border-radius:3px;background:var(--sun);margin:16px 0 12px}
.shead .kicker{color:var(--hot);font-weight:900;font-size:1.05rem}
.shead .sub{margin:6px 0 0}
.shead .hero{width:clamp(170px,30vw,300px);background:#fff;border:2px solid var(--line);border-radius:22px;padding:8px}
.shead .hero svg{width:100%;height:auto;display:block}
.shead .mini{font-size:42px;line-height:1;margin-bottom:10px}
#liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.ucard{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
a.ucard:hover,a.ucard:focus-visible{transform:translateY(-3px);border-color:var(--sun);box-shadow:0 8px 20px rgba(59,52,44,.12);outline:none}
.ucard .ic{flex:0 0 auto;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:32px;line-height:1;border:2px solid var(--line);background:var(--bg)}
.ucard .nr{display:inline-block;font-size:.8rem;font-weight:900;letter-spacing:.04em;color:#fff;border-radius:999px;padding:1px 10px}
.ucard .title{font-size:1.08rem;font-weight:900;line-height:1.25;margin-top:3px}
.ucard .go{font-size:.85rem;color:var(--muted);margin-top:2px}
a.ucard.test{background:#FCEBCB;border-color:#F0CFA0}
a.ucard.test .ic{background:#FFF4E2;border-color:#F0CFA0}
a.ucard.soon{pointer-events:none;opacity:.5}
a.ucard.locked{background:#EEE8DD;cursor:not-allowed}
a.ucard.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
a.ucard.locked .ic{filter:grayscale(1);opacity:.5}
a.ucard.locked .title,a.ucard.locked .nr{opacity:.55}
a.ucard.locked .go{color:var(--ink);font-weight:800}
a.ucard.shake{animation:shake .35s}
.sfoot{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:26px;text-align:center}
.sfoot .tbtn{margin:0}
@media (max-width:560px){.shead{grid-template-columns:1fr}.shead .hero{width:180px;justify-self:center;grid-row:1}}
/* Übungsseite */
.xhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;padding-top:18px;margin-bottom:12px}
.xhead h1{margin:0;font-size:clamp(1.5rem,3.6vw,2.2rem);font-weight:900}
.xhead .tag{color:var(--hot);font-weight:900;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tabs button{font-weight:900;font-size:1.02rem;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sun);border-color:var(--sun);color:#2b2620}
.tabs button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.lvl>.sub{margin:10px 0 0}
.result .nm{font:inherit;padding:6px 12px;border-radius:10px;border:2px solid var(--line);width:180px}
.backbtn{position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:rgba(255,253,248,.96);color:var(--ink);font-weight:800;font-size:15px;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.18);border:2px solid var(--sun)}
@media (prefers-reduced-motion:reduce){a.ucard{transition:none}}
</style></head>

<script>/* Freigabe der Übungen durch die Lehrkraft.
   Zustand liegt im Gerät (localStorage) und kann per Link/QR an alle iPads verteilt werden:
   index.html?frei=2.1,2.2&t=<Zeitstempel>   (frei=- bedeutet: alles gesperrt)  */
(function () {
  var ALL = ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7"];
  var KEY = "nt5tw_freigabe", PIN = "5555";
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.open) return s; } catch (e) {}
    return { open: ALL.slice(), t: 0 };            // Standard: alles offen
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  var st = load();

  // Freigabe-Link übernehmen (nur wenn neuer als der gespeicherte Stand)
  var q = new URLSearchParams(location.search);
  if (q.has("frei")) {
    var t = parseInt(q.get("t") || "0", 10);
    if (t >= (st.t || 0)) {
      var f = q.get("frei");
      st = { open: f === "-" ? [] : f.split(",").filter(function (x) { return ALL.indexOf(x) >= 0; }), t: t };
      save(st);
    }
    history.replaceState(null, "", location.pathname);
  }
  var isOpen = function (no) { return st.open.indexOf(no) >= 0; };
  window.NT5_FREI = { isOpen: isOpen };

  // ---------- Übungsseite: gesperrt? ----------
  var page = document.body.getAttribute("data-uebung");
  if (page) {
    if (!isOpen(page)) {
      window.NT5_LOCKED = true;
      document.body.innerHTML = '<main class="wrap"><div class="card lockpage"><div style="font-size:64px">🔒</div>' +
        '<h1>Übung ' + page + ' ist noch gesperrt</h1><p class="sub">Deine Lehrkraft schaltet sie frei, wenn ihr das Thema besprochen habt.</p>' +
        '<a class="pill" href="index.html">← Zur Übersicht</a></div></main>';
    }
    return;
  }

  // ---------- Startseite ----------
  function paint() {
    document.querySelectorAll(".ucard[data-no]").forEach(function (a) {
      var no = a.getAttribute("data-no"), o = isOpen(no);
      a.classList.toggle("locked", !o);
      a.querySelector(".go").textContent = o ? "Übung starten →" : "🔒 gesperrt";
      a.setAttribute("aria-disabled", o ? "false" : "true");
    });
    var n = st.open.length;
    var info = document.getElementById("freiinfo");
    if (info) info.textContent = n === ALL.length ? "" : n === 0 ? "Alle Übungen sind gerade gesperrt." : "Freigegeben: " + st.open.join(", ");
  }
  document.querySelectorAll(".ucard[data-no]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      if (!isOpen(a.getAttribute("data-no"))) { e.preventDefault(); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); }
    });
  });
  paint();

  // ---------- Lehrkraft-Bereich ----------
  var dlg = document.getElementById("teacher");
  if (!dlg) return;
  var pinBox = document.getElementById("pinbox"), panel = document.getElementById("tpanel");
  document.getElementById("tbtn").onclick = function () {
    dlg.hidden = false; pinBox.hidden = false; panel.hidden = true;
    var inp = document.getElementById("pin"); inp.value = ""; document.getElementById("pinerr").textContent = ""; inp.focus();
  };
  document.getElementById("tclose").onclick = function () { dlg.hidden = true; };
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.hidden = true; });
  function tryPin() {
    if (document.getElementById("pin").value.trim() === PIN) { pinBox.hidden = true; panel.hidden = false; buildList(); }
    else document.getElementById("pinerr").textContent = "Falscher Code.";
  }
  document.getElementById("pinok").onclick = tryPin;
  document.getElementById("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPin(); });

  function link() {
    var base = location.href.split("?")[0].split("#")[0];
    return base + "?frei=" + (st.open.length ? st.open.join(",") : "-") + "&t=" + st.t;
  }
  function update() {
    st.t = Date.now(); save(st); paint();
    var l = link(); document.getElementById("tlink").value = l;
    var qr = document.getElementById("qr"); qr.innerHTML = "";
    if (window.QRCode) new QRCode(qr, { text: l, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    else qr.textContent = "(QR-Code braucht Internet)";
  }
  function buildList() {
    var box = document.getElementById("tlist"); box.innerHTML = "";
    document.querySelectorAll(".ucard[data-no]").forEach(function (a) {
      var no = a.getAttribute("data-no"), title = a.getAttribute("data-title");
      var row = document.createElement("label"); row.className = "trow";
      row.innerHTML = '<span class="no" style="background:' + a.getAttribute("data-col") + '">' + no + '</span><span class="tt">' + title +
        '</span><input type="checkbox" class="sw"' + (isOpen(no) ? " checked" : "") + '><span class="swl"></span>';
      row.querySelector("input").onchange = function () {
        var on = this.checked;
        st.open = ALL.filter(function (x) { return x === no ? on : isOpen(x); });
        update();
      };
      box.appendChild(row);
    });
    update();
  }
  document.getElementById("allon").onclick = function () { st.open = ALL.slice(); buildList(); };
  document.getElementById("alloff").onclick = function () { st.open = []; buildList(); };
  document.getElementById("copy").onclick = function () {
    var i = document.getElementById("tlink"); i.select();
    (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(function () {
      document.getElementById("copy").textContent = "✓ Kopiert";
    }, function () { document.execCommand("copy"); document.getElementById("copy").textContent = "✓ Kopiert"; });
    setTimeout(function () { document.getElementById("copy").textContent = "Link kopieren"; }, 1800);
  };
})();
</script>
<script>/* Übungs-Engine NT 5 · Temperatur und Wärme. Daten: window.PAGE */
(function () {
  "use strict";
  var P = window.PAGE;
  if (!P || window.NT5_LOCKED) return;
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function strip(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function speak(text) {
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text.replace(/°C/g, " Grad Celsius").replace(/−/g, "minus "));
      u.lang = "de-DE"; u.rate = 0.9; speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- Thermometer-SVG ---------- */
  function thermoSVG(val, lo, hi, show, col) {
    col = col || "#C9553A";
    var top = 20, bot = 250;
    function y(v) { return bot - (v - lo) / (hi - lo) * (bot - top); }
    var s = '<svg viewBox="0 0 120 300"><rect x="30" y="5" width="60" height="290" rx="10" fill="#fff" stroke="#3B342C" stroke-width="2"/>' +
      '<rect x="54" y="' + (top - 6) + '" width="12" height="' + (bot - top + 18) + '" rx="6" fill="#EEF3F6" stroke="#3B342C" stroke-width="1.6"/>';
    for (var v = lo; v <= hi; v += 2) {
      var big = v % 10 === 0;
      s += '<line x1="66" x2="' + (66 + (big ? 12 : 6)) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#3B342C" stroke-width="' + (big ? 1.6 : 1) + '"/>';
      if (big) s += '<text x="50" y="' + (y(v) + 4) + '" font-size="12" font-weight="700" text-anchor="end" fill="#3B342C">' + String(v).replace("-", "−") + '</text>';
    }
    var vv = show ? val : lo;
    s += '<rect class="col" x="57" y="' + y(vv) + '" width="6" height="' + (bot + 14 - y(vv)) + '" fill="' + col + '"/>';
    s += '<circle cx="60" cy="268" r="12" fill="' + col + '" stroke="#3B342C" stroke-width="1.6"/>';
    s += '<text x="80" y="18" font-size="12" font-weight="700" fill="#3B342C">°C</text></svg>';
    return s;
  }
  function fmt(v) { return String(v).replace("-", "−") + " °C"; }

  /* ---------- Aufgaben-Renderer ---------- */
  var R = {};

  R.mc = function (t, body, api) {
    if (t.img) body.appendChild(el("div", "fig", P.img[t.img]));
    var hasImg = t.opts.some(function (o) { return o.img; });
    var box = el("div", "opts" + (hasImg ? " img" : ""));
    var order = shuffle(t.opts.map(function (_, i) { return i; }));
    var sel = null, btns = [];
    order.forEach(function (i) {
      var o = t.opts[i]; var b = el("button", "opt");
      b.innerHTML = (o.img ? P.img[o.img] : "") + "<span>" + (o.t || o) + "</span>";
      b.onclick = function () { if (api.locked()) return; btns.forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); sel = i; api.ready(true); };
      b.dataset.i = i; btns.push(b); box.appendChild(b);
    });
    body.appendChild(box);
    api.max = 1;
    api.check = function () {
      btns.forEach(function (b) { var i = +b.dataset.i; if (i === t.a) b.classList.add("ok"); else if (i === sel) b.classList.add("bad"); });
      return sel === t.a ? 1 : 0;
    };
  };

  R.multi = function (t, body, api) {
    var box = el("div", "opts img"); var chosen = {}; var btns = [];
    t.opts.forEach(function (o, i) {
      var b = el("button", "opt"); b.innerHTML = (o.img ? P.img[o.img] : "") + "<span>" + o.t + "</span>";
      b.onclick = function () { if (api.locked()) return; chosen[i] = !chosen[i]; b.classList.toggle("sel", chosen[i]); api.ready(true); };
      btns.push(b); box.appendChild(b);
    });
    body.appendChild(box); api.max = t.opts.length;
    api.check = function () {
      var p = 0;
      btns.forEach(function (b, i) { var should = t.a.indexOf(i) >= 0; var ok = !!chosen[i] === should; if (ok) p++; if (should) b.classList.add(ok ? "ok" : "bad"); else if (chosen[i]) b.classList.add("bad"); });
      return p;
    };
  };

  R.tf = function (t, body, api) {
    if (t.img) body.appendChild(el("div", "fig", P.img[t.img]));
    var box = el("div", "tf"); var ans = []; var rows = [];
    t.items.forEach(function (it, i) {
      var r = el("div", "tfrow"); r.appendChild(el("span", "t", it[0]));
      [["richtig", true], ["falsch", false]].forEach(function (o) {
        var b = el("button", "", o[0]);
        b.onclick = function () { if (api.locked()) return; ans[i] = o[1]; r.querySelectorAll("button").forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); api.ready(ans.filter(function (x) { return x !== undefined; }).length === t.items.length); };
        r.appendChild(b);
      });
      rows.push(r); box.appendChild(r);
    });
    body.appendChild(box); api.max = t.items.length;
    api.check = function () { var p = 0; t.items.forEach(function (it, i) { var ok = ans[i] === it[1]; if (ok) p++; rows[i].classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.match = function (t, body, api) {
    var m = el("div", "match"); var L = el("div", "col"), Rr = el("div", "col");
    var pairs = {}, active = null, n = 0; var lb = [], rb = [];
    t.left.forEach(function (x, i) {
      var b = el("button", "mitem", x); b.dataset.i = i;
      b.onclick = function () { if (api.locked()) return; lb.forEach(function (y) { y.classList.remove("active"); }); active = i; b.classList.add("active"); };
      lb.push(b); L.appendChild(b);
    });
    shuffle(t.right.map(function (_, i) { return i; })).forEach(function (j) {
      var b = el("button", "mitem", t.right[j]); b.dataset.j = j;
      b.onclick = function () {
        if (api.locked() || active === null) return;
        Object.keys(pairs).forEach(function (k) { if (pairs[k] === j) delete pairs[k]; });
        pairs[active] = j; redraw(); active = null; lb.forEach(function (y) { y.classList.remove("active"); });
        api.ready(Object.keys(pairs).length === t.left.length);
      };
      rb.push(b); Rr.appendChild(b);
    });
    function redraw() {
      rb.forEach(function (b) { var tg = b.querySelector(".tag"); if (tg) tg.remove(); });
      lb.forEach(function (b) { var tg = b.querySelector(".tag"); if (tg) tg.remove(); });
      Object.keys(pairs).forEach(function (k) {
        var letter = String.fromCharCode(65 + (+k));
        lb[k].appendChild(el("span", "tag", letter));
        rb.forEach(function (b) { if (+b.dataset.j === pairs[k]) b.appendChild(el("span", "tag", letter)); });
      });
    }
    m.appendChild(L); m.appendChild(Rr); body.appendChild(el("p", "sub", "Tippe links, dann rechts.")); body.appendChild(m);
    api.max = t.left.length;
    api.check = function () { var p = 0; lb.forEach(function (b, i) { var ok = pairs[i] === i; if (ok) p++; b.classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.cloze = function (t, body, api) {
    var parts = t.text.split(/\{(.+?)\}/); var answers = [], gaps = [], fill = [];
    var p = el("p", "cloze"); var active = null;
    parts.forEach(function (s, i) {
      if (i % 2 === 0) { p.appendChild(document.createTextNode(s)); return; }
      var k = answers.length; answers.push(s);
      var g = el("button", "gap", "&nbsp;"); g.onclick = function () { if (api.locked()) return; if (fill[k]) { release(k); } gaps.forEach(function (x) { x.classList.remove("active"); }); active = k; g.classList.add("active"); };
      gaps.push(g); p.appendChild(g);
    });
    var bank = el("div", "bank"); var chips = [];
    shuffle(answers.concat(t.extra || [])).forEach(function (w) {
      var c = el("button", "chip", w);
      c.onclick = function () {
        if (api.locked() || c.classList.contains("used")) return;
        if (active === null) { active = fill.findIndex ? firstEmpty() : 0; }
        if (active === null || active < 0) return;
        if (fill[active]) release(active);
        fill[active] = c; c.classList.add("used"); gaps[active].textContent = w; gaps[active].classList.remove("active");
        active = firstEmpty(); if (active >= 0) gaps[active].classList.add("active"); else active = null;
        api.ready(firstEmpty() < 0);
      };
      chips.push(c); bank.appendChild(c);
    });
    function firstEmpty() { for (var i = 0; i < answers.length; i++) if (!fill[i]) return i; return -1; }
    function release(k) { if (fill[k]) { fill[k].classList.remove("used"); fill[k] = null; gaps[k].innerHTML = "&nbsp;"; api.ready(false); } }
    active = 0; gaps[0] && gaps[0].classList.add("active");
    body.appendChild(p); body.appendChild(bank); api.max = answers.length;
    api.check = function () { var pt = 0; answers.forEach(function (a, i) { var ok = fill[i] && fill[i].textContent === a; if (ok) pt++; gaps[i].classList.add(ok ? "ok" : "bad"); if (!ok) gaps[i].title = a; }); return pt; };
    api.solution = function () { answers.forEach(function (a, i) { if (!gaps[i].classList.contains("ok")) gaps[i].innerHTML = "<s>" + (fill[i] ? fill[i].textContent : "") + "</s> " + a; }); };
  };

  R.order = function (t, body, api) {
    var box = el("div", "olist"); var seq = []; var cards = [];
    body.appendChild(el("p", "sub", "Tippe die Sätze in der richtigen Reihenfolge an."));
    shuffle(t.items.map(function (_, i) { return i; })).forEach(function (i) {
      var c = el("button", "ocard", '<span class="n"></span><span>' + t.items[i] + "</span>"); c.dataset.i = i;
      c.onclick = function () {
        if (api.locked()) return;
        var pos = seq.indexOf(i);
        if (pos >= 0) seq.splice(pos, 1); else seq.push(i);
        cards.forEach(function (x) { var k = seq.indexOf(+x.dataset.i); x.classList.toggle("sel", k >= 0); x.querySelector(".n").textContent = k >= 0 ? k + 1 : ""; });
        api.ready(seq.length === t.items.length);
      };
      cards.push(c); box.appendChild(c);
    });
    body.appendChild(box); api.max = t.items.length;
    api.check = function () { var p = 0; cards.forEach(function (c) { var i = +c.dataset.i; var ok = seq.indexOf(i) === i; if (ok) p++; c.classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.sort = function (t, body, api) {
    var pool = el("div", "pool"); var buckets = el("div", "buckets"); var where = {}; var active = null; var chips = [];
    var bEls = t.buckets.map(function (name, bi) {
      var b = el("div", "bucket"); b.appendChild(el("h4", "", name));
      b.onclick = function (e) { if (api.locked() || active === null || e.target.classList.contains("chip")) return; place(active, bi); };
      buckets.appendChild(b); return b;
    });
    shuffle(t.items.map(function (_, i) { return i; })).forEach(function (i) {
      var c = el("button", "chip", t.items[i][0]); c.dataset.i = i;
      c.onclick = function (e) { e.stopPropagation(); if (api.locked()) return; chips.forEach(function (x) { x.classList.remove("active"); }); active = i; c.classList.add("active"); bEls.forEach(function (b) { b.classList.add("hl"); }); };
      chips.push(c); pool.appendChild(c);
    });
    function place(i, bi) {
      var c = chips.filter(function (x) { return +x.dataset.i === i; })[0];
      bEls[bi].appendChild(c); where[i] = bi; c.classList.remove("active"); active = null; bEls.forEach(function (b) { b.classList.remove("hl"); });
      api.ready(Object.keys(where).length === t.items.length);
    }
    body.appendChild(el("p", "sub", "Tippe ein Kärtchen an, dann den passenden Kasten.")); body.appendChild(pool); body.appendChild(buckets);
    api.max = t.items.length;
    api.check = function () { var p = 0; chips.forEach(function (c) { var i = +c.dataset.i; var ok = where[i] === t.items[i][1]; if (ok) p++; c.classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.thermo = function (t, body, api) {
    var lo = t.lo, hi = t.hi; var box = el("div", "thermos"); var vals = [], ths = [];
    t.values.forEach(function (v, i) {
      var th = el("div", "th", thermoSVG(v, lo, hi, true)); var st = el("div", "stepper");
      var cur = t.start != null ? t.start : 20; vals[i] = null;
      var vEl = el("span", "v", "?");
      var mk = function (d, lab) { var b = el("button", "", lab); b.onclick = function () { if (api.locked()) return; cur = Math.max(lo, Math.min(hi, (vals[i] == null ? cur : vals[i]) + d)); vals[i] = cur; vEl.textContent = fmt(cur); api.ready(vals.every(function (x) { return x != null; })); }; return b; };
      st.appendChild(mk(-5, "−5")); st.appendChild(mk(-1, "−")); st.appendChild(vEl); st.appendChild(mk(1, "+")); st.appendChild(mk(5, "+5"));
      th.appendChild(st); ths.push(th); box.appendChild(th);
    });
    body.appendChild(el("p", "sub", "Stelle mit + und − die abgelesene Temperatur ein.")); body.appendChild(box);
    api.max = t.values.length;
    api.check = function () { var p = 0; t.values.forEach(function (v, i) { var ok = vals[i] === v; if (ok) p++; ths[i].classList.add(ok ? "ok" : "bad"); if (!ok) ths[i].appendChild(el("div", "badge2", "richtig: " + fmt(v))); }); return p; };
  };

  R.setthermo = function (t, body, api) {
    var lo = t.lo, hi = t.hi; var wrap = el("div", "setth"); var vals = [], boxes = [];
    t.targets.forEach(function (target, i) {
      var th = el("div", "th"); th.appendChild(el("div", "badge2", "Stelle ein: " + fmt(target)));
      var holder = el("div", "", thermoSVG(lo, lo, hi, true, t.col || "#C9553A")); th.appendChild(holder);
      var r = el("input"); r.type = "range"; r.min = lo; r.max = hi; r.step = 1; r.value = lo; r.style.width = "140px";
      var out = el("div", "badge2", fmt(lo));
      r.oninput = function () { if (api.locked()) return; vals[i] = +r.value; holder.innerHTML = thermoSVG(+r.value, lo, hi, true, t.col); out.textContent = fmt(+r.value); api.ready(vals.filter(function (x) { return x != null; }).length === t.targets.length); };
      r.setAttribute("aria-label", "Temperatur einstellen");
      th.appendChild(r); th.appendChild(out); boxes.push(th); wrap.appendChild(th);
    });
    body.appendChild(el("p", "sub", "Ziehe den Regler, bis die rote Säule bei der richtigen Zahl steht.")); body.appendChild(wrap);
    api.max = t.targets.length;
    api.check = function () { var p = 0; t.targets.forEach(function (v, i) { var ok = Math.abs((vals[i] == null ? 999 : vals[i]) - v) <= (t.tol || 0); if (ok) p++; boxes[i].classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  /* Teilchen-Simulation (ohne Punkte) */
  R.sim = function (t, body, api) {
    var box = el("div", "sim"); var cv = el("canvas"); cv.width = 760; cv.height = 360; box.appendChild(cv);
    var ctl = el("div", "simctl", '<span>❄ kalt</span>'); var r = el("input"); r.type = "range"; r.min = 0; r.max = 100; r.value = 20; r.setAttribute("aria-label", "Temperatur");
    ctl.appendChild(r); ctl.appendChild(el("span", "", "🔥 warm")); box.appendChild(ctl);
    var info = el("p", "sub", ""); box.appendChild(info); body.appendChild(box);
    var ctx = cv.getContext("2d"); var N = 30; var ps = [];
    for (var i = 0; i < N; i++) ps.push({ x: 0, y: 0, vx: Math.random() - .5, vy: Math.random() - .5, hx: (i % 6), hy: Math.floor(i / 6) });
    function frame() {
      var T = +r.value / 100; var W = 220 + T * 480; var H = 150 + T * 180; var x0 = (760 - W) / 2, y0 = 360 - H - 6;
      var speed = 0.3 + T * 4.5;
      ctx.clearRect(0, 0, 760, 360);
      ctx.fillStyle = "#FFF7E8"; ctx.fillRect(x0, y0, W, H);
      ctx.setLineDash([8, 6]); ctx.strokeStyle = "#3B342C"; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, W, H); ctx.setLineDash([]);
      var col = "rgb(" + Math.round(91 + T * 137) + "," + Math.round(155 - T * 68) + "," + Math.round(213 - T * 152) + ")";
      ps.forEach(function (p) {
        var gx = x0 + 18 + p.hx * (W - 36) / 5, gy = y0 + 16 + p.hy * (H - 32) / 4;
        p.vx += (Math.random() - .5) * speed * .6; p.vy += (Math.random() - .5) * speed * .6;
        p.vx *= .8; p.vy *= .8; p.x += p.vx; p.y += p.vy;
        var lim = 2 + T * 26; p.x = Math.max(-lim, Math.min(lim, p.x)); p.y = Math.max(-lim, Math.min(lim, p.y));
        ctx.beginPath(); ctx.arc(gx + p.x, gy + p.y, 12, 0, 6.283); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = "#3B342C"; ctx.lineWidth = 1.6; ctx.stroke();
      });
      info.textContent = T < .33 ? "Kalt: Die Teilchen zittern nur wenig und liegen eng beieinander." : T < .66 ? "Wärmer: Die Teilchen bewegen sich stärker und brauchen mehr Platz." : "Heiß: Die Teilchen bewegen sich heftig – der Stoff dehnt sich aus!";
      requestAnimationFrame(frame);
    }
    frame(); api.max = 0; api.noscore = true;
  };

  /* ---------- Seite aufbauen (Aufbau wie GPG 5: Kopf, Reiter je Stufe, Übersicht-Knopf) ---------- */
  var root = document.getElementById("app");
  var key = "nt5tw_" + P.no;
  var state = store.get(key) || {};
  var LV = [null, { t: "⭐ Stufe 1", k: "Grundlagen" }, { t: "⭐⭐ Stufe 2", k: "Üben" }, { t: "⭐⭐⭐ Profi", k: "Knobeln" }];

  var head = el("header", "xhead");
  head.innerHTML = "<h1>" + P.title + '</h1><span class="tag">' + P.no + " · " + (P.sub || "") + "</span>";
  root.appendChild(head);
  var tabs = el("nav", "tabs"); tabs.setAttribute("role", "tablist"); tabs.setAttribute("aria-label", "Bereiche");
  root.appendChild(tabs);
  var secs = [];
  function addTab(label, sec) {
    var b = el("button", "", label); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", secs.length ? "false" : "true");
    if (secs.length) sec.hidden = true;
    b.onclick = function () {
      secs.forEach(function (x) { x[0].setAttribute("aria-selected", "false"); x[1].hidden = true; });
      b.setAttribute("aria-selected", "true"); sec.hidden = false; window.scrollTo(0, 0);
    };
    secs.push([b, sec]); tabs.appendChild(b); root.appendChild(sec);
  }

  [1, 2, 3].forEach(function (lv) {
    var list = P.tasks.filter(function (t) { return t.stars === lv; });
    if (!list.length) return;
    var sec = el("section", "lvl");
    sec.appendChild(el("p", "sub", "<b>" + LV[lv].k + "</b> · " + list.length + " Aufgabe" + (list.length > 1 ? "n" : "") + ". 🔊 liest die Aufgabe vor."));
    var total = 0, got = 0, checked = 0, scorable = 0;
    var res = el("section", "card result");
    list.forEach(function (t, idx) {
      var card = el("section", "card s" + t.stars);
      var qh = el("div", "qhead");
      qh.appendChild(el("span", "qnum", idx + 1));
      qh.appendChild(el("div", "q", t.q));
      var sp = el("button", "speak", "🔊"); sp.title = "Vorlesen"; sp.onclick = function () { speak(strip(t.q) + (t.read ? ". " + t.read : "")); };
      qh.appendChild(sp); card.appendChild(qh);
      var body = el("div"); card.appendChild(body);
      var locked = false;
      var actions = el("div", "actions");
      var chk = el("button", "btn", "Prüfen"); chk.disabled = true;
      var api = { locked: function () { return locked; }, ready: function (b) { chk.disabled = !b; } };
      R[t.type](t, body, api);
      var fb = el("div", "fb"); var tip = el("div", "tip", "💡 " + (t.tip || ""));
      if (!api.noscore) {
        scorable++; total += api.max;
        actions.appendChild(chk);
        if (t.tip) { var tb = el("button", "btn sec", "💡 Tipp"); tb.onclick = function () { tip.classList.toggle("show"); }; actions.appendChild(tb); }
        chk.onclick = function () {
          if (locked) return; locked = true; chk.disabled = true;
          var p = api.check(); got += p; checked++;
          if (api.solution && p < api.max) api.solution();
          fb.className = "fb " + (p === api.max ? "ok" : "bad");
          fb.innerHTML = (p === api.max ? "Super! Alles richtig. " : "Du hast " + p + " von " + api.max + " Punkten. ") + (t.why ? "<br><span style='font-weight:600'>" + t.why + "</span>" : "");
          if (p === api.max) card.classList.add("done-ok");
          upd();
        };
        card.appendChild(actions); card.appendChild(tip); card.appendChild(fb);
      }
      sec.appendChild(card);
    });
    sec.appendChild(res);
    function upd() {
      if (checked < scorable) { res.innerHTML = "<p class='sub' style='margin:0'>Noch " + (scorable - checked) + " Aufgabe(n) bis zum Ergebnis.</p>"; return; }
      var pct = total ? got / total : 0;
      var suns = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
      var nm = store.get("nt5tw_name") || "";
      res.innerHTML = '<div class="big">' + "☀️".repeat(suns) + "🌥️".repeat(3 - suns) + '</div><div class="score">' + got + " / " + total + " Punkte</div>" +
        '<p><input class="nm" placeholder="Dein Vorname" value="' + nm.replace(/"/g, "") + '"> · ' + P.no + " " + LV[lv].t + " · " + new Date().toLocaleDateString("de-DE") + "</p>" +
        "<p class='sub'>Mach einen Screenshot und zeige ihn deiner Lehrkraft.</p>" +
        '<div class="actions" style="justify-content:center"><button class="btn" onclick="location.reload()">Nochmal üben</button>' +
        (lv < 3 && secs.length > lv ? '<button class="btn sec nx">Weiter zu ' + LV[lv + 1].t + " ➜</button>" : "") + "</div>";
      var inp = res.querySelector(".nm"); inp.oninput = function () { store.set("nt5tw_name", inp.value); };
      var nx = res.querySelector(".nx"); if (nx) nx.onclick = function () { secs[lv][0].click(); };
      var b = state["b" + lv] || 0; if (got >= b) { state["b" + lv] = got; state["t" + lv] = total; store.set(key, state); }
    }
    upd();
    addTab(LV[lv].t, sec);
  });

  if (P.film) {
    var fs = el("section", "lvl");
    var f = el("div", "card"); f.innerHTML = '<a class="film" href="' + P.film.url + '" target="_blank" rel="noopener"><span class="play">▶</span><span><b>' + P.film.t + '</b>' + P.film.d + '<br><small>planet-schule.de · öffnet in neuem Fenster</small></span></a>';
    fs.appendChild(f); addTab("🎬 Film", fs);
  }
  root.appendChild(el("p", "foot", "NT 5 · Kapitel 2 Temperatur und Wärme · Buch " + (P.book || "")));
  var back = el("a", "backbtn", "← Übersicht"); back.href = "index.html"; document.body.appendChild(back);
  window.__thermoSVG = thermoSVG;
})();
</script></body></html>
