<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2.2 Die Celsiusskala · NT 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>/* Übungsseiten NT 5 – Aufbau und Look wie die GPG-5-Übungen (Canva-Masterfolie):
   cremefarbener Grund, Cinzel-Überschrift, goldene Reiter, rostrote Kennzeichnung.
   Oben Reiter, links die Abbildung (Spielfläche), rechts das Bedienfeld. */
:root{
  --paper:#f4ede4; --card:#fffaf3; --ink:#3f3a34; --muted:#7a6f62; --line:#e4d8c8;
  --gold:#e8a33d; --rust:#c0573e; --ok:#3f8f4a; --bad:#c0392b; --okl:#e3f1e3; --badl:#f8e1dc; --sel:#fbe6c8; --sky:#e9f1f7;
  --display:"Cinzel", Georgia, serif; --body:"Nunito", system-ui, sans-serif;
  color-scheme: light;
  --sun:#e8a33d; --hot:#c0573e; --cold:#2f6fb0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:600;margin:0;font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 70px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;padding-top:16px}
h1{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2.3rem);letter-spacing:.04em;margin:0;text-wrap:balance}
.tag{color:var(--rust);font-weight:900;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button,.pill{font:900 1.02rem var(--body);background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.tabs button[aria-selected="true"],.pill[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2b2620}
.lvl{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;min-width:0}
.stage .fig{margin:0;max-width:none}
.stage svg{display:block;width:100%;height:auto;max-height:62vh}
.side{display:grid;gap:12px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.box.solo{max-width:900px;width:100%}
.kicker{font-size:.8rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--rust)}
.big{font-size:clamp(1.15rem,2.6vw,1.45rem);font-weight:900;line-height:1.3;margin:6px 0 12px}
.box p{margin:6px 0;line-height:1.5;font-size:1.05rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row.between{justify-content:space-between;flex-wrap:nowrap;margin-top:0}
.btn{font:900 1.05rem var(--body);background:var(--gold);color:#2b2620;border:0;border-radius:999px;padding:11px 22px;min-height:46px}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.msg{font-weight:900;font-size:1.1rem;margin:10px 0 0}
.msg:empty{display:none}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.msg .why{display:block;font-weight:700;font-size:1rem;color:var(--ink);margin-top:4px}
.score{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:900}
.score:empty{display:none}
.src{color:var(--muted);font-size:.78rem}
.foot{text-align:center;margin-top:18px}
.speak{flex:0 0 auto;border:2px solid var(--line);background:var(--paper);border-radius:999px;width:42px;height:42px;font-size:19px}
.tip{display:none;background:#fff4e2;border:2px dashed #f0cfa0;border-radius:12px;padding:8px 12px}
.tip.show{display:block}
.sub{color:var(--muted);margin:0 0 10px;font-size:.95rem}

/* Antwortknöpfe wie im GPG-Quiz */
.fig{max-width:380px;margin:0 auto 12px}
.fig svg,.opt svg{width:100%;height:auto;display:block;background:#fff;border-radius:12px;border:1px solid var(--line)}
.opts{display:grid;gap:10px}
.opts.img{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{font:800 1.08rem var(--body);text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:52px}
.opt.sel{border-color:var(--gold);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--okl)}
.opt.bad{border-color:var(--bad);background:var(--badl)}
/* richtig / falsch */
.tf{display:grid;gap:10px}
.tfrow{display:flex;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.tfrow .t{flex:1;font-weight:800}
.tfrow button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;min-width:84px;font-weight:900}
.tfrow button.sel{border-color:var(--gold);background:var(--gold);color:#2b2620}
.tfrow.ok{border-color:var(--ok);background:var(--okl)}.tfrow.bad{border-color:var(--bad);background:var(--badl)}
/* zuordnen */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.match .col{display:grid;gap:10px;align-content:start}
.mitem{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;font-weight:800;text-align:left;position:relative}
.mitem.active{border-color:var(--gold);box-shadow:0 0 0 4px var(--sel)}
.mitem .tag{position:absolute;top:-10px;right:-8px;background:var(--ink);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;letter-spacing:0}
.mitem.ok{border-color:var(--ok);background:var(--okl)}.mitem.bad{border-color:var(--bad);background:var(--badl)}
/* Lückentext */
.cloze{font-size:1.15rem;line-height:2.5;margin:0 0 12px}
.gap{display:inline-block;min-width:110px;border:0;border-bottom:3px solid var(--rust);background:#fff;border-radius:10px 10px 0 0;padding:0 10px;font-weight:900;line-height:1.7;text-align:center}
.gap.active{background:var(--sel);border-color:var(--gold)}
.gap.ok{background:var(--okl);border-color:var(--ok)}.gap.bad{background:var(--badl);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--paper);border-radius:14px;border:2px dashed var(--gold)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:900;min-height:44px}
.chip.used{opacity:.3}
.chip.active{border-color:var(--gold);background:var(--sel)}
.chip.ok{border-color:var(--ok);background:var(--okl)}.chip.bad{border-color:var(--bad);background:var(--badl)}
/* Reihenfolge */
.olist{display:grid;gap:10px}
.ocard{display:flex;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;text-align:left;width:100%}
.ocard .n{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:2px dashed var(--muted);display:grid;place-items:center;font-weight:900}
.ocard.sel .n{border:0;background:var(--gold);color:#2b2620}
.ocard.ok{border-color:var(--ok);background:var(--okl)}.ocard.bad{border-color:var(--bad);background:var(--badl)}
/* sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:14px;background:var(--paper);margin-bottom:12px}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.bucket{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;background:#fff;cursor:pointer}
.bucket h4{margin:0 0 8px;font-size:1rem;font-weight:900}
.bucket .chip{display:inline-block;margin:3px}
.bucket.hl{border-color:var(--gold);background:#fffaf0}
/* Thermometer */
.thermos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.th{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.th svg{height:230px;width:auto}
.stepper{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.stepper button{width:36px;height:40px;padding:0;border-radius:999px;border:2px solid var(--line);background:var(--card);font-size:20px;font-weight:900}
.stepper .v{min-width:62px;text-align:center;font-weight:900;font-size:1.15rem}
.th.ok{border-color:var(--ok);background:var(--okl)}.th.bad{border-color:var(--bad);background:var(--badl)}
.setth{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.badge2{font-weight:900}
/* Simulation */
.sim canvas{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:1px solid var(--line);touch-action:none}
.simctl{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;font-weight:800}
.simctl input{flex:1;min-width:180px;accent-color:var(--rust)}
/* Film */
.film{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;margin-top:8px}
.film .play{flex:0 0 64px;height:64px;border-radius:18px;background:var(--rust);color:#fff;display:grid;place-items:center;font-size:28px}
.film .big{display:block;margin:0}
/* Ergebnis */
.result{text-align:center}
.result .row{justify-content:center}
.result .sun{font-size:52px;line-height:1.1;margin-top:6px}
.result .nm{font:inherit;padding:6px 12px;border-radius:999px;border:2px solid var(--line);width:180px;background:#fff}
/* gesperrte Übung */
.lockpage{text-align:center;padding:40px 20px;margin-top:40px}
.lockpage h1{font-size:1.6rem}
.lockpage .pill{display:inline-block;text-decoration:none;margin-top:10px}
@media (max-width:560px){.match{gap:8px}.mitem{font-size:15px;padding:8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Thermometer exakt ablesbar */
.thermos{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important}
.th{display:flex;flex-direction:column;align-items:center;gap:6px}
.th svg{width:170px!important;height:auto!important;max-height:none!important;background:transparent!important;border:0!important}
.stepper{display:flex!important;flex-direction:column;align-items:center;gap:6px}
.stepper .v{font-size:1.35rem!important;font-weight:900;min-width:0!important}
.sbtns{display:flex;gap:6px}
.sbtns button{min-width:40px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:1rem;padding:0 6px}
.sbtns button:active{background:var(--sel)}
.thfig{max-width:190px!important}
.stage .thfig svg{width:170px!important;margin:0 auto;max-height:none}
.stage .fig.thfig{margin:0 auto}
</style></head>

<script>/* Freigabe der Übungen durch die Lehrkraft.
   Zustand liegt im Gerät (localStorage) und kann per Link/QR an alle iPads verteilt werden:
   index.html?frei=2.1,2.2&t=<Zeitstempel>   (frei=- bedeutet: alles gesperrt)  */
(function () {
  var ALL = ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7"];
  var KEY = "nt5tw_freigabe";
  var PIN = (typeof LEHRERCODE !== "undefined" ? String(LEHRERCODE) : "5555");
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.open) return s; } catch (e) {}
    return { open: ALL.slice(), t: 0 };            // Standard: alles offen
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  var st = load();

  // Freigabe-Link übernehmen (nur wenn neuer als der gespeicherte Stand)
  var q = new URLSearchParams(location.search);
  if (q.has("frei")) {
    var t = parseInt(q.get("t") || "0", 10);
    if (t >= (st.t || 0)) {
      var f = q.get("frei");
      st = { open: f === "-" ? [] : f.split(",").filter(function (x) { return ALL.indexOf(x) >= 0; }), t: t };
      save(st);
    }
    history.replaceState(null, "", location.pathname);
  }
  var isOpen = function (no) { return st.open.indexOf(no) >= 0; };
  window.NT5_FREI = { isOpen: isOpen };

  // ---------- Übungsseite: gesperrt? ----------
  var page = document.body.getAttribute("data-uebung");
  if (page) {
    if (!isOpen(page)) {
      window.NT5_LOCKED = true;
      document.body.innerHTML = '<main class="wrap"><div class="box lockpage"><div style="font-size:64px">🔒</div>' +
        '<h1>Übung ' + page + ' ist noch gesperrt</h1><p class="sub">Deine Lehrkraft schaltet sie frei, wenn ihr das Thema besprochen habt.</p>' +
        '<a class="pill" href="index.html">← Zur Übersicht</a></div></main>';
    }
    return;
  }

  // ---------- Startseite ----------
  function paint() {
    document.querySelectorAll("a.card[data-no]").forEach(function (a) {
      var no = a.getAttribute("data-no"), o = isOpen(no);
      a.classList.toggle("locked", !o);
      a.querySelector(".go").textContent = o ? "Übung starten →" : "🔒 gesperrt";
      a.setAttribute("aria-disabled", o ? "false" : "true");
    });
    var n = st.open.length;
    var info = document.getElementById("freiinfo");
    if (info) info.textContent = n === ALL.length ? "" : n === 0 ? "Alle Übungen sind gerade gesperrt." : "Freigegeben: " + st.open.join(", ");
  }
  document.querySelectorAll("a.card[data-no]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      if (!isOpen(a.getAttribute("data-no"))) { e.preventDefault(); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); }
    });
  });
  paint();

  // ---------- Lehrkraft-Bereich ----------
  var dlg = document.getElementById("teacher");
  if (!dlg) return;
  var pinBox = document.getElementById("pinbox"), panel = document.getElementById("tpanel");
  document.getElementById("tbtn").onclick = function () {
    dlg.hidden = false; pinBox.hidden = false; panel.hidden = true;
    var inp = document.getElementById("pin"); inp.value = ""; document.getElementById("pinerr").textContent = ""; inp.focus();
  };
  document.getElementById("tclose").onclick = function () { dlg.hidden = true; };
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.hidden = true; });
  function tryPin() {
    if (document.getElementById("pin").value.trim() === PIN) { pinBox.hidden = true; panel.hidden = false; buildList(); }
    else document.getElementById("pinerr").textContent = "Falscher Code.";
  }
  document.getElementById("pinok").onclick = tryPin;
  document.getElementById("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") tryPin(); });

  function link() {
    var base = /^https?:/.test(location.protocol) ? location.href.split("?")[0].split("#")[0]
             : (typeof ADRESSE !== "undefined" ? ADRESSE : location.href.split("?")[0]);
    return base + "?frei=" + (st.open.length ? st.open.join(",") : "-") + "&t=" + st.t;
  }
  function qrSvg(text) {
    try { var q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
    catch (e) { return "<p>QR-Code konnte nicht erzeugt werden.</p>"; }
  }
  function openList() { return st.open.length ? st.open.join(" · ") : "keine (alles gesperrt)"; }
  function update() {
    st.t = Date.now(); save(st); paint();
    var l = link(); document.getElementById("tlink").value = l;
    document.getElementById("qr").innerHTML = qrSvg(l);
    document.getElementById("qrinfo").textContent = "Offen: " + openList();
    var big = document.getElementById("qrbig");
    if (!big.hidden) showBig();
  }
  function showBig() {
    var big = document.getElementById("qrbig");
    big.querySelector(".qrcode").innerHTML = qrSvg(link());
    big.querySelector(".qropen").textContent = "Offen: " + openList();
    big.hidden = false;
  }
  document.getElementById("qrshow").onclick = showBig;
  document.getElementById("qrbig").onclick = function () { this.hidden = true; };
  function buildList() {
    var box = document.getElementById("tlist"); box.innerHTML = "";
    document.querySelectorAll("a.card[data-no]").forEach(function (a) {
      var no = a.getAttribute("data-no"), title = a.getAttribute("data-title");
      var row = document.createElement("label"); row.className = "trow";
      row.innerHTML = '<span class="no" style="background:' + a.getAttribute("data-col") + '">' + no + '</span><span class="tt">' + title +
        '</span><input type="checkbox" class="sw"' + (isOpen(no) ? " checked" : "") + '><span class="swl"></span>';
      row.querySelector("input").onchange = function () {
        var on = this.checked;
        st.open = ALL.filter(function (x) { return x === no ? on : isOpen(x); });
        update();
      };
      box.appendChild(row);
    });
    update();
  }
  document.getElementById("allon").onclick = function () { st.open = ALL.slice(); buildList(); };
  document.getElementById("alloff").onclick = function () { st.open = []; buildList(); };
  document.getElementById("copy").onclick = function () {
    var i = document.getElementById("tlink"); i.select();
    (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(function () {
      document.getElementById("copy").textContent = "✓ Kopiert";
    }, function () { document.execCommand("copy"); document.getElementById("copy").textContent = "✓ Kopiert"; });
    setTimeout(function () { document.getElementById("copy").textContent = "Link kopieren"; }, 1800);
  };
})();
</script>
<script>/* Übungs-Engine NT 5 · Temperatur und Wärme. Daten: window.PAGE */
(function () {

  /* ---------- Thermometer-SVG: 1 kleiner Strich = 1 °C, mittlerer Strich = 5 °C, Zahl alle 10 °C ---------- */
  function thermoSVG(val, lo, hi, show, col) {
    col = col || "#C0573E";
    var ppd = Math.max(5, Math.min(9, 330 / (hi - lo)));       // Pixel pro Grad
    var top = 34, bot = top + (hi - lo) * ppd, W = 170, H = bot + 62;

      '<rect x="22" y="6" width="126" height="' + (H - 12) + '" rx="14" fill="#fff" stroke="#3F3A34" stroke-width="2"/>' +
      '<rect x="72" y="' + (top - 12) + '" width="18" height="' + (bot - top + 26) + '" rx="9" fill="#EEF3F6" stroke="#3F3A34" stroke-width="1.8"/>';
    for (var v = lo; v <= hi; v++) {

      s += '<line x1="92" x2="' + (92 + len) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#3F3A34" stroke-width="' + sw + '"/>';
      if (ten) s += '<text x="66" y="' + (+y(v) + 5.5) + '" font-size="16" font-weight="800" text-anchor="end" fill="#3F3A34" font-family="Nunito,Arial,sans-serif">' + String(v).replace("-", "−") + "</text>";
    }

    var vv = show ? val : lo;
    s += '<rect x="76" y="' + y(vv) + '" width="10" height="' + (bot + 30 - y(vv)) + '" fill="' + col + '"/>';
    s += '<circle cx="81" cy="' + (bot + 30) + '" r="17" fill="' + col + '" stroke="#3F3A34" stroke-width="1.8"/>';
    s += '<text x="124" y="' + (top - 14) + '" font-size="15" font-weight="800" fill="#3F3A34" font-family="Nunito,Arial,sans-serif">°C</text></svg>';
    return s;
  }
  function stepper(onChange, isLocked) {
    var st = el("div", "stepper"); var vEl = el("div", "v", "?"); st.appendChild(vEl);
    var row = el("div", "sbtns");

      b.onclick = function () { if (isLocked()) return; onChange(d[0], vEl); }; row.appendChild(b);
    });

  }
  function fmt(v) { return String(v).replace("-", "−") + " °C"; }

  /* ---------- Aufgaben-Renderer ---------- */
  var R = {};

  function fig(t, body) {
    if (t.th) body.appendChild(el("div", "fig thfig", thermoSVG(t.th[0], t.th[1], t.th[2], true)));

  }
  R.mc = function (t, body, api) {

    var hasImg = t.opts.some(function (o) { return o.img; });
    var box = el("div", "opts" + (hasImg ? " img" : ""));
    var order = shuffle(t.opts.map(function (_, i) { return i; }));
    var sel = null, btns = [];
    order.forEach(function (i) {
      var o = t.opts[i]; var b = el("button", "opt");
      b.innerHTML = (o.img ? P.img[o.img] : "") + "<span>" + (o.t || o) + "</span>";
      b.onclick = function () { if (api.locked()) return; btns.forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); sel = i; api.ready(true); };
      b.dataset.i = i; btns.push(b); box.appendChild(b);
    });
    body.appendChild(box);
    api.max = 1;
    api.check = function () {
      btns.forEach(function (b) { var i = +b.dataset.i; if (i === t.a) b.classList.add("ok"); else if (i === sel) b.classList.add("bad"); });
      return sel === t.a ? 1 : 0;
    };
  };

  R.multi = function (t, body, api) {
    var box = el("div", "opts img"); var chosen = {}; var btns = [];
    t.opts.forEach(function (o, i) {
      var b = el("button", "opt"); b.innerHTML = (o.img ? P.img[o.img] : "") + "<span>" + o.t + "</span>";
      b.onclick = function () { if (api.locked()) return; chosen[i] = !chosen[i]; b.classList.toggle("sel", chosen[i]); api.ready(true); };
      btns.push(b); box.appendChild(b);
    });
    body.appendChild(box); api.max = t.opts.length;
    api.check = function () {
      var p = 0;
      btns.forEach(function (b, i) { var should = t.a.indexOf(i) >= 0; var ok = !!chosen[i] === should; if (ok) p++; if (should) b.classList.add(ok ? "ok" : "bad"); else if (chosen[i]) b.classList.add("bad"); });
      return p;

  };

  R.tf = function (t, body, api) {

    t.items.forEach(function (it, i) {
      var r = el("div", "tfrow"); r.appendChild(el("span", "t", it[0]));
      [["richtig", true], ["falsch", false]].forEach(function (o) {
        var b = el("button", "", o[0]);
        b.onclick = function () { if (api.locked()) return; ans[i] = o[1]; r.querySelectorAll("button").forEach(function (x) { x.classList.remove("sel"); }); b.classList.add("sel"); api.ready(ans.filter(function (x) { return x !== undefined; }).length === t.items.length); };
        r.appendChild(b);
      });
      rows.push(r); box.appendChild(r);
    });
    body.appendChild(box); api.max = t.items.length;
    api.check = function () { var p = 0; t.items.forEach(function (it, i) { var ok = ans[i] === it[1]; if (ok) p++; rows[i].classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.match = function (t, body, api) {

    var m = el("div", "match"); var L = el("div", "col"), Rr = el("div", "col");
    var pairs = {}, active = null, n = 0; var lb = [], rb = [];
    t.left.forEach(function (x, i) {
      var b = el("button", "mitem", x); b.dataset.i = i;
      b.onclick = function () { if (api.locked()) return; lb.forEach(function (y) { y.classList.remove("active"); }); active = i; b.classList.add("active"); };
      lb.push(b); L.appendChild(b);
    });
    shuffle(t.right.map(function (_, i) { return i; })).forEach(function (j) {
      var b = el("button", "mitem", t.right[j]); b.dataset.j = j;
      b.onclick = function () {

      lb.forEach(function (b) { var tg = b.querySelector(".tag"); if (tg) tg.remove(); });

  };

  R.cloze = function (t, body, api) {
    fig(t, body);
    var parts = t.text.split(/\{(.+?)\}/); var answers = [], gaps = [], fill = [];
    var p = el("p", "cloze"); var active = null;
    parts.forEach(function (s, i) {
      if (i % 2 === 0) { p.appendChild(document.createTextNode(s)); return; }
      var k = answers.length; answers.push(s);
      var g = el("button", "gap", "&nbsp;"); g.onclick = function () { if (api.locked()) return; if (fill[k]) { release(k); } gaps.forEach(function (x) { x.classList.remove("active"); }); active = k; g.classList.add("active"); };
      gaps.push(g); p.appendChild(g);
    });
    var bank = el("div", "bank"); var chips = [];
    shuffle(answers.concat(t.extra || [])).forEach(function (w) {
      var c = el("button", "chip", w);
      c.onclick = function () {
        if (api.locked() || c.classList.contains("used")) return;
        if (active === null) { active = fill.findIndex ? firstEmpty() : 0; }
        if (active === null || active < 0) return;
        if (fill[active]) release(active);
        fill[active] = c; c.classList.add("used"); gaps[active].textContent = w; gaps[active].classList.remove("active");
        active = firstEmpty(); if (active >= 0) gaps[active].classList.add("active"); else active = null;
        api.ready(firstEmpty() < 0);
      };
      chips.push(c); bank.appendChild(c);
    });
    function firstEmpty() { for (var i = 0; i < answers.length; i++) if (!fill[i]) return i; return -1; }
    function release(k) { if (fill[k]) { fill[k].classList.remove("used"); fill[k] = null; gaps[k].innerHTML = "&nbsp;"; api.ready(false); } }
    active = 0; gaps[0] && gaps[0].classList.add("active");
    body.appendChild(p); body.appendChild(bank); api.max = answers.length;
    api.check = function () { var pt = 0; answers.forEach(function (a, i) { var ok = fill[i] && fill[i].textContent === a; if (ok) pt++; gaps[i].classList.add(ok ? "ok" : "bad"); if (!ok) gaps[i].title = a; }); return pt; };
    api.solution = function () { answers.forEach(function (a, i) { if (!gaps[i].classList.contains("ok")) gaps[i].innerHTML = "<s>" + (fill[i] ? fill[i].textContent : "") + "</s> " + a; }); };
  };

  R.order = function (t, body, api) {
    fig(t, body);
    var box = el("div", "olist"); var seq = []; var cards = [];
    body.appendChild(el("p", "sub", "Tippe die Sätze in der richtigen Reihenfolge an."));
    shuffle(t.items.map(function (_, i) { return i; })).forEach(function (i) {
      var c = el("button", "ocard", '<span class="n"></span><span>' + t.items[i] + "</span>"); c.dataset.i = i;
      c.onclick = function () {
        if (api.locked()) return;
        var pos = seq.indexOf(i);
        if (pos >= 0) seq.splice(pos, 1); else seq.push(i);
        cards.forEach(function (x) { var k = seq.indexOf(+x.dataset.i); x.classList.toggle("sel", k >= 0); x.querySelector(".n").textContent = k >= 0 ? k + 1 : ""; });
        api.ready(seq.length === t.items.length);
      };
      cards.push(c); box.appendChild(c);
    });
    body.appendChild(box); api.max = t.items.length;
    api.check = function () { var p = 0; cards.forEach(function (c) { var i = +c.dataset.i; var ok = seq.indexOf(i) === i; if (ok) p++; c.classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.sort = function (t, body, api) {
    fig(t, body);
    var pool = el("div", "pool"); var buckets = el("div", "buckets"); var where = {}; var active = null; var chips = [];
    var bEls = t.buckets.map(function (name, bi) {
      var b = el("div", "bucket"); b.appendChild(el("h4", "", name));
      b.onclick = function (e) { if (api.locked() || active === null || e.target.classList.contains("chip")) return; place(active, bi); };
      buckets.appendChild(b); return b;
    });
    shuffle(t.items.map(function (_, i) { return i; })).forEach(function (i) {
      var c = el("button", "chip", t.items[i][0]); c.dataset.i = i;
      c.onclick = function (e) { e.stopPropagation(); if (api.locked()) return; chips.forEach(function (x) { x.classList.remove("active"); }); active = i; c.classList.add("active"); bEls.forEach(function (b) { b.classList.add("hl"); }); };
      chips.push(c); pool.appendChild(c);
    });
    function place(i, bi) {
      var c = chips.filter(function (x) { return +x.dataset.i === i; })[0];
      bEls[bi].appendChild(c); where[i] = bi; c.classList.remove("active"); active = null; bEls.forEach(function (b) { b.classList.remove("hl"); });
      api.ready(Object.keys(where).length === t.items.length);
    }
    body.appendChild(el("p", "sub", "Tippe ein Kärtchen an, dann den passenden Kasten.")); body.appendChild(pool); body.appendChild(buckets);
    api.max = t.items.length;
    api.check = function () { var p = 0; chips.forEach(function (c) { var i = +c.dataset.i; var ok = where[i] === t.items[i][1]; if (ok) p++; c.classList.add(ok ? "ok" : "bad"); }); return p; };
  };

  R.thermo = function (t, body, api) {
    var lo = t.lo, hi = t.hi; var box = el("div", "thermos"); var vals = [], ths = [];
    t.values.forEach(function (v, i) {
      var th = el("div", "th"); th.appendChild(el("div", "badge2", "Thermometer " + String.fromCharCode(65 + i)));
      th.appendChild(el("div", "", thermoSVG(v, lo, hi, true)));
      vals[i] = null; var cur = 0;
      th.appendChild(stepper(function (d, vEl) {
        cur = Math.max(lo, Math.min(hi, (vals[i] == null ? 0 : cur) + d)); vals[i] = cur; vEl.textContent = fmt(cur);
        api.ready(vals.every(function (x) { return x != null; }));
      }, api.locked));
      ths.push(th); box.appendChild(th);
    });
    body.appendChild(el("p", "sub", "Lies genau ab: 1 kleiner Strich = 1 °C. Stelle deinen Wert mit den Knöpfen ein (Start bei 0 °C)."));
    body.appendChild(box); api.max = t.values.length;
    api.check = function () { var p = 0; t.values.forEach(function (v, i) { var ok = vals[i] === v; if (ok) p++; ths[i].classList.add(ok ? "ok" : "bad"); if (!ok) ths[i].appendChild(el("div", "badge2", "richtig: " + fmt(v))); }); return p; };
  };

  R.setthermo = function (t, body, api) {
    var lo = t.lo, hi = t.hi; var wrap = el("div", "thermos"); var vals = [], boxes = [];
    t.targets.forEach(function (target, i) {
      var th = el("div", "th"); th.appendChild(el("div", "badge2", "Stelle ein: " + fmt(target)));
      var cur = t.start != null ? t.start : 10;
      var holder = el("div", "", thermoSVG(cur, lo, hi, true)); th.appendChild(holder);
      vals[i] = null;
      var st = stepper(function (d, vEl) {
        cur = Math.max(lo, Math.min(hi, cur + d)); vals[i] = cur; holder.innerHTML = thermoSVG(cur, lo, hi, true);
        api.ready(vals.every(function (x) { return x != null; }));
      }, api.locked);
      st.querySelector(".v").hidden = true;
      th.appendChild(st); boxes.push(th); wrap.appendChild(th);
    });
    body.appendChild(el("p", "sub", "Bewege die rote Säule mit den Knöpfen genau auf die richtige Zahl."));
    body.appendChild(wrap); api.max = t.targets.length;
    api.check = function () { var p = 0; t.targets.forEach(function (v, i) { var ok = vals[i] === v; if (ok) p++; boxes[i].classList.add(ok ? "ok" : "bad"); if (!ok) boxes[i].appendChild(el("div", "badge2", "richtig: " + fmt(v))); }); return p; };
  };

  /* Teilchen-Simulation (ohne Punkte) */
  R.sim = function (t, body, api) {
    var box = el("div", "sim"); var cv = el("canvas"); cv.width = 760; cv.height = 360; box.appendChild(cv);
    var ctl = el("div", "simctl", '<span>❄ kalt</span>'); var r = el("input"); r.type = "range"; r.min = 0; r.max = 100; r.value = 20; r.setAttribute("aria-label", "Temperatur");
    ctl.appendChild(r); ctl.appendChild(el("span", "", "🔥 warm")); box.appendChild(ctl);
    var info = el("p", "sub", ""); box.appendChild(info); body.appendChild(box);
    var ctx = cv.getContext("2d"); var N = 30; var ps = [];
    for (var i = 0; i < N; i++) ps.push({ x: 0, y: 0, vx: Math.random() - .5, vy: Math.random() - .5, hx: (i % 6), hy: Math.floor(i / 6) });
    function frame() {
      var T = +r.value / 100; var W = 220 + T * 480; var H = 150 + T * 180; var x0 = (760 - W) / 2, y0 = 360 - H - 6;
      var speed = 0.3 + T * 4.5;
      ctx.clearRect(0, 0, 760, 360);
      ctx.fillStyle = "#FFF7E8"; ctx.fillRect(x0, y0, W, H);
      ctx.setLineDash([8, 6]); ctx.strokeStyle = "#3B342C"; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, W, H); ctx.setLineDash([]);
      var col = "rgb(" + Math.round(91 + T * 137) + "," + Math.round(155 - T * 68) + "," + Math.round(213 - T * 152) + ")";
      ps.forEach(function (p) {
        var gx = x0 + 18 + p.hx * (W - 36) / 5, gy = y0 + 16 + p.hy * (H - 32) / 4;
        p.vx += (Math.random() - .5) * speed * .6; p.vy += (Math.random() - .5) * speed * .6;
        p.vx *= .8; p.vy *= .8; p.x += p.vx; p.y += p.vy;
        var lim = 2 + T * 26; p.x = Math.max(-lim, Math.min(lim, p.x)); p.y = Math.max(-lim, Math.min(lim, p.y));
        ctx.beginPath(); ctx.arc(gx + p.x, gy + p.y, 12, 0, 6.283); ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = "#3B342C"; ctx.lineWidth = 1.6; ctx.stroke();
      });
      info.textContent = T < .33 ? "Kalt: Die Teilchen zittern nur wenig und liegen eng beieinander." : T < .66 ? "Wärmer: Die Teilchen bewegen sich stärker und brauchen mehr Platz." : "Heiß: Die Teilchen bewegen sich heftig – der Stoff dehnt sich aus!";
      requestAnimationFrame(frame);
    }
    frame(); api.max = 0; api.noscore = true;
  };

  /* ---------- Seite aufbauen – Aufbau wie GPG 5: Kopf, Reiter, Spielfläche + Bedienfeld, Übersicht-Knopf ---------- */
  var root = document.getElementById("app");
  var key = "nt5tw_" + P.no;
  var state = store.get(key) || {};

  var head = el("header", "");
  head.innerHTML = "<h1>" + P.title.replace(" – Teste dich", "") + '</h1><span class="tag">' + P.no + " · " + (P.sub || "") + "</span>";
  root.appendChild(head);
  var tabs = el("nav", "tabs"); tabs.setAttribute("role", "tablist"); tabs.setAttribute("aria-label", "Bereiche");
  root.appendChild(tabs);
  var secs = [];
  function addTab(label, sec) {
    var b = el("button", "", label); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", secs.length ? "false" : "true");
    if (secs.length) sec.hidden = true;
    b.onclick = function () {
      secs.forEach(function (x) { x[0].setAttribute("aria-selected", "false"); x[1].hidden = true; });
      b.setAttribute("aria-selected", "true"); sec.hidden = false; window.scrollTo(0, 0);
    };
    secs.push([b, sec]); tabs.appendChild(b); root.appendChild(sec);
  }

  function seq(list, label, isTest, nextLabel) {
    var myTab = secs.length;
    var sec = el("section", "lvl");
    var total = 0, got = 0, cur = 0, panes = [];
    list.forEach(function (t, idx) {
      var pane = el("div", "pane"); if (idx) pane.hidden = true;
      var box = el("div", "box");
      var top = el("div", "row between");
      top.appendChild(el("div", "kicker", "Aufgabe " + (idx + 1) + " von " + list.length));
      var sp = el("button", "speak", "🔊"); sp.type = "button"; sp.title = "Vorlesen"; sp.setAttribute("aria-label", "Vorlesen");
      sp.onclick = function () { speak(strip(t.q) + (t.read ? ". " + t.read : "")); };
      top.appendChild(sp); box.appendChild(top);
      box.appendChild(el("div", "big", t.q));
      var body = el("div", "body"); box.appendChild(body);
      var locked = false;
      var actions = el("div", "row");
      var chk = el("button", "btn", "Prüfen"); chk.type = "button"; chk.disabled = true;
      var nxt = el("button", "btn", idx < list.length - 1 ? "Weiter ➜" : "Ergebnis ➜"); nxt.type = "button"; nxt.hidden = true;
      var api = { locked: function () { return locked; }, ready: function (b) { chk.disabled = !b; } };
      R[t.type](t, body, api);
      var fig = body.querySelector(".fig");
      var msg = el("p", "msg"); msg.setAttribute("aria-live", "polite");
      var tip = el("p", "tip", "💡 " + (t.tip || ""));
      nxt.onclick = function () { pane.hidden = true; cur++; if (panes[cur]) panes[cur].hidden = false; else showRes(); window.scrollTo(0, 0); };
      if (api.noscore) { nxt.hidden = false; actions.appendChild(nxt); }
      else {
        total += api.max;
        actions.appendChild(chk);
        if (t.tip) { var tb = el("button", "btn ghost", "💡 Tipp"); tb.type = "button"; tb.onclick = function () { tip.classList.toggle("show"); }; actions.appendChild(tb); }
        actions.appendChild(nxt);
        chk.onclick = function () {
          if (locked) return; locked = true; chk.hidden = true;
          var p = api.check(); got += p;
          if (api.solution && p < api.max) api.solution();
          msg.className = "msg " + (p === api.max ? "ok" : "bad");
          msg.innerHTML = (p === api.max ? "✓ Super! Alles richtig." : "Du hast " + p + " von " + api.max + " Punkten.") + (t.why ? "<span class='why'>" + t.why + "</span>" : "");
          score.textContent = "Punkte: " + got + " / " + total;
          nxt.hidden = false;
        };
      }
      box.appendChild(tip); box.appendChild(msg); box.appendChild(actions);
      if (fig) {
        pane.className = "pane grid2";
        var stage = el("div", "stage"); stage.appendChild(fig); pane.appendChild(stage);
        var side = el("div", "side"); side.appendChild(box); pane.appendChild(side);
      } else { box.classList.add("solo"); pane.appendChild(box); }
      panes.push(pane); sec.appendChild(pane);
    });
    var score = el("div", "score", ""); sec.appendChild(score);
    var res = el("div", "box solo result"); res.hidden = true; sec.appendChild(res);
    function showRes() {
      var pct = total ? got / total : 1;
      var suns = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
      score.hidden = true; res.hidden = false;
      res.innerHTML = '<div class="kicker">Geschafft · ' + label.replace(/^\S+\s/, "") + '</div><div class="sun">' + "☀️".repeat(suns) + "🌥️".repeat(3 - suns) + '</div><div class="big">' + got + " / " + total + " Punkte</div>" +
        '<div class="row"><button class="btn" type="button" onclick="location.reload()">Nochmal üben</button>' +
        (nextLabel ? '<button class="btn ghost nx" type="button">Weiter: ' + nextLabel + " ➜</button>" : "") + "</div>";
      var nx = res.querySelector(".nx"); if (nx) nx.onclick = function () { secs[myTab + 1][0].click(); };
      var k2 = isTest ? "test" : "ueben"; var b = state[k2] || 0; if (got >= b) { state[k2] = got; state[k2 + "_t"] = total; store.set(key, state); }
    }
    if (isTest) sec.insertBefore(el("p", "sub", "Kleiner Test: Zeig, was du in dieser Stunde gelernt hast."), sec.firstChild);
    addTab(label, sec);
  }

  var hasFilm = !!P.film;
  var ueben = P.tasks.slice().sort(function (x, y) { return (x.stars || 0) - (y.stars || 0); });
  seq(ueben, "✏️ Üben", false, hasFilm ? "🎬 Film" : (P.test ? "❓ Test" : ""));
  if (hasFilm) {
    var fs = el("section", "lvl");
    var f = el("div", "box solo"); f.innerHTML = '<div class="kicker">Film-Tipp</div><a class="film" href="' + P.film.url + '" target="_blank" rel="noopener"><span class="play">▶</span><span><span class="big">' + P.film.t + '</span><p>' + P.film.d + '</p><span class="src">planet-schule.de · öffnet in neuem Fenster</span></span></a>';
    if (P.test) { var fn = el("div", "row"); var fb2 = el("button", "btn", "Weiter: ❓ Test ➜"); fb2.type = "button"; fn.appendChild(fb2); f.appendChild(fn); fb2.onclick = function () { secs[secs.length - 1][0].click(); }; }
    fs.appendChild(f); addTab("🎬 Film", fs);
  }
  if (P.test) seq(P.test, "❓ Test", true, "");
  root.appendChild(el("p", "src foot", "NT 5 · Kapitel 2 Temperatur und Wärme · Buch " + (P.book || "")));
  var back = el("a", "", "← Übersicht"); back.href = "index.html"; back.id = "zur-uebersicht";
  back.setAttribute("style", "position:fixed;z-index:9;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.94);color:#2f5d46;font:800 15px/1 'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.18);border:2px solid #2f7d5b");
  document.body.appendChild(back);
  window.__thermoSVG = thermoSVG;
})();
</script></body></html>
